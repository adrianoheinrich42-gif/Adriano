[project]
name = "flugalarm-backend"
version = "0.1.0"
description = "Backend für die Flugpreis-Alarm-App"
# 3.12 ist das Ziel (siehe Projektplan); 3.11 wird toleriert, damit das
# Projekt auch auf älteren Systemen ohne Docker läuft.
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    # JWT-Prüfung der Supabase-Token (M2). Reicht für HS256; für die
    # asymmetrische Variante (RS256/ES256) käme "pyjwt[crypto]" dazu.
    "pyjwt>=2.9",
    # HTTP-Client für Amadeus (M5). Stand vorher nur in der dev-Gruppe
    # (für den Testclient) — jetzt braucht ihn der Anwendungscode selbst.
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pywebpush>=2.4.0",
    "anthropic>=0.121.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migrationen erzeugt Alembic maschinell. Lange CHECK-Ausdrücke dort
# umzubrechen, bringt nichts und geht beim nächsten Autogenerate verloren.
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

# `pywebpush` bringt keine Typ-Informationen mit (kein py.typed). Der Import
# wird deshalb einzeln freigestellt — nicht global, damit ein fehlender Typ
# an einer anderen Stelle weiterhin auffällt.
[[tool.mypy.overrides]]
module = ["pywebpush.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# APScheduler liefert keine Typinformationen mit (kein py.typed). Ohne diese
# Ausnahme scheitert `strict` schon am Import. Betrifft nur diese eine
# Bibliothek — der eigene Code bleibt vollständig geprüft.
module = ["apscheduler.*"]
ignore_missing_imports = true
