[alembic]
script_location = alembic

# Migrationsdateien bekommen einen Zeitstempel im Namen, damit sie in der
# richtigen Reihenfolge im Ordner stehen: 2026_08_07_1420-a1b2c3_beschreibung.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

prepend_sys_path = .
timezone = UTC

# WICHTIG: Hier steht bewusst KEIN sqlalchemy.url.
# Die Verbindung kommt aus app/config.py, also aus der Umgebung.
# Ein Passwort in einer versionierten Datei wäre ein Sicherheitsfehler.

[post_write_hooks]
# Neu erzeugte Migrationen automatisch formatieren.
# type = exec (nicht console_scripts): ruff wird als Binary ausgeliefert
# und meldet keinen console_scripts-Entrypoint an.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
